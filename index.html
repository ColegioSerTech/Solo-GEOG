<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mistérios do Solo</title>
<style>
:root{
  --bg:#0c0a09; --card:#231f1d; --line:#3a3330;
  --txt:#f5f5f4; --dim:#a8a29e; --amber:#f59e0b; --amber2:#fbbf24;
  --indigo:#818cf8; --green:#22c55e; --red:#ef4444; --accent:var(--amber);
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background:
    radial-gradient(60% 45% at 8% -8%, rgba(120,53,15,.55), transparent 70%),
    radial-gradient(55% 45% at 105% 105%, rgba(49,46,129,.35), transparent 70%);
}
#fx{position:fixed;inset:0;z-index:90;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:16px 16px 48px}

header{display:flex;align-items:center;gap:12px;padding:12px 0 8px}
.brand{
  width:46px;height:46px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;
  font-size:24px;background:linear-gradient(145deg,#b45309,#78350f);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 22px -10px #000
}
.brand.late{background:linear-gradient(145deg,#4f46e5,#312e81)}
h1{font-size:18px;font-weight:900;letter-spacing:-.4px;text-transform:uppercase;line-height:1}
.sub{font-size:9.5px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-top:5px}
.tools{margin-left:auto;display:flex;gap:6px}
.icobtn{
  width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:#00000030;
  color:var(--dim);font-size:15px;cursor:pointer;display:grid;place-items:center;transition:.15s
}
.icobtn:hover{color:var(--txt);border-color:var(--accent)}

.hud{display:flex;gap:8px;margin:10px 0 12px}
.stat{
  flex:1;background:#00000040;border:1px solid var(--line);border-radius:14px;
  padding:8px 10px;text-align:center;min-width:0
}
.stat b{display:block;font-size:17px;font-weight:900;line-height:1.1}
.stat span{font-size:8.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#78716c}
.bar{height:7px;background:#00000055;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--amber2));transition:width .6s cubic-bezier(.2,.9,.2,1)}
body.late .bar i{background:linear-gradient(90deg,#6366f1,var(--indigo))}

.card{
  background:linear-gradient(180deg,rgba(41,37,36,.92),rgba(28,25,23,.92));
  border:1px solid var(--line);border-radius:var(--r);padding:18px;
  box-shadow:0 26px 60px -30px #000; backdrop-filter:blur(6px)
}
.card.late{border-color:rgba(129,140,248,.4)}
.anim{animation:pop .35s cubic-bezier(.2,.9,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.shake{animation:shake .4s}
@keyframes shake{10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-7px)}}

.phead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tag{
  font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.28);
  padding:4px 9px;border-radius:99px;white-space:nowrap
}
body.late .tag{color:var(--indigo);background:rgba(129,140,248,.12);border-color:rgba(129,140,248,.3)}
.ghost{
  margin-left:auto;background:none;border:0;color:#78716c;font-size:10px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:6px
}
.ghost:hover{color:var(--txt)}
h2.ptitle{font-size:24px;font-weight:900;letter-spacing:-.8px;text-transform:uppercase;line-height:1.05;margin-bottom:12px}
.brief{
  background:#00000045;border-left:4px solid var(--accent);border-radius:0 12px 12px 0;
  padding:12px 14px;font-size:13.5px;line-height:1.6;color:#d6d3d1
}
body.late .brief{border-left-color:var(--indigo)}
.prompt{font-size:15px;font-weight:700;line-height:1.5;margin:16px 0 12px;text-align:center}
.steps{display:flex;gap:5px;justify-content:center;margin:14px 0 2px}
.steps i{width:22px;height:4px;border-radius:99px;background:#44403c}
.steps i.on{background:var(--accent)}

.btn{
  width:100%;border:0;border-radius:14px;padding:15px 18px;font-size:14px;font-weight:900;
  letter-spacing:.04em;text-transform:uppercase;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,var(--amber),#d97706);box-shadow:0 10px 24px -12px var(--amber);
  transition:transform .12s, filter .15s
}
.btn:hover{filter:brightness(1.1)} .btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.35;cursor:not-allowed;filter:none;box-shadow:none}
.btn.lateb{background:linear-gradient(180deg,#6366f1,#4338ca);box-shadow:0 10px 24px -12px #6366f1}
.btn.gr{background:linear-gradient(180deg,#22c55e,#15803d);box-shadow:0 10px 24px -12px #22c55e}
.btn.gh{background:#00000040;border:1px solid var(--line);color:var(--dim);box-shadow:none}
.row{display:flex;gap:10px;margin-top:14px}
.row .btn{flex:1}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:center;gap:12px;text-align:left;width:100%;cursor:pointer;
  background:#1917169c;border:2px solid #3a3330;border-radius:14px;padding:13px 14px;
  color:var(--txt);font-size:13.5px;font-weight:700;line-height:1.35;transition:.15s
}
.opt:hover{border-color:var(--accent);transform:translateX(3px)}
.opt.on{border-color:var(--accent);background:rgba(245,158,11,.14)}
body.late .opt.on{border-color:var(--indigo);background:rgba(129,140,248,.14)}
.opt.ok{border-color:var(--green);background:rgba(34,197,94,.15)}
.opt.no{border-color:var(--red);background:rgba(239,68,68,.12);opacity:.65}
.opt .k{
  flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:#00000055;font-size:11px;font-weight:900;color:#a8a29e
}
.opt.on .k{background:var(--accent);color:#1c1917}
.opt em{display:block;font-size:11px;font-weight:600;font-style:normal;color:#a8a29e;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{
  cursor:pointer;background:#19171699;border:2px solid #3a3330;border-radius:14px;
  padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;
  color:var(--txt);transition:.15s
}
.tile span.e{font-size:26px;line-height:1}
.tile span.l{font-size:9.5px;font-weight:900;text-transform:uppercase;text-align:center;letter-spacing:.03em}
.tile.on{border-color:var(--accent);background:rgba(245,158,11,.16);transform:scale(1.04)}
.tile:hover{border-color:#57534e}

.dig{display:flex;flex-direction:column;gap:3px;background:#000;padding:5px;border-radius:14px;border:3px solid #292524}
.dig button{
  height:50px;border:0;border-radius:7px;cursor:pointer;color:#ffffff7a;position:relative;
  font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;transition:.3s
}
.dig button:hover{filter:brightness(1.18)}
.dig button.gone{color:transparent;background:#0a0a0a !important;box-shadow:inset 0 3px 14px #000;height:26px}
.dig button.gone::after{content:"\26CF";color:#44403c;font-size:14px;position:absolute;inset:0;display:grid;place-items:center}
.speech{
  display:flex;gap:10px;align-items:center;background:#00000055;border:1px solid var(--line);
  border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:12.5px;line-height:1.45;color:#fde68a
}
.speech .who{font-size:24px}

.sortlist{display:flex;flex-direction:column;gap:8px}
.sortitem{
  display:flex;align-items:center;gap:10px;background:#19171699;border:2px solid #3a3330;
  border-radius:13px;padding:11px 12px
}
.sortitem .dot{width:12px;height:12px;border-radius:99px;flex:0 0 auto}
.sortitem .nm{font-size:12.5px;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
.sortitem .ar{margin-left:auto;display:flex;gap:5px}
.sortitem .ar button{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#00000050;
  color:var(--accent);font-size:13px;cursor:pointer
}
.sortitem .ar button[disabled]{opacity:.2;cursor:default}
.hintline{font-size:10.5px;color:#78716c;text-align:center;margin-top:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}

.gauge{background:#00000050;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
.gauge .big{font-size:46px;font-weight:900;letter-spacing:-2px;line-height:1}
.gauge .lbl{font-size:9px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:#78716c}
.gauge .st{font-size:12px;font-weight:900;text-transform:uppercase;margin-top:4px}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:99px;margin:16px 0;
  background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e,#38bdf8,#818cf8);cursor:pointer
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:28px;height:28px;border-radius:99px;background:#fff;
  border:4px solid var(--accent);box-shadow:0 4px 12px #000;cursor:grab
}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:99px;background:#fff;border:4px solid var(--accent)}
.mix{display:flex;gap:10px;height:150px;margin-bottom:4px}
.mixcol{
  flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  border:3px solid #57534e;border-radius:0 0 14px 14px;overflow:hidden;background:#00000050
}
.mixcol i{display:block;width:100%;transition:height .3s}
.mixcol span{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:900;text-shadow:0 2px 6px #000}
.nums{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.num{background:#00000050;border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center}
.num .l{font-size:9.5px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}
.num .c{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:7px}
.num .c button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#00000060;color:var(--txt);font-size:17px;font-weight:900;cursor:pointer}
.num .c b{width:44px;font-size:17px;font-weight:900}
.total{text-align:center;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin:12px 0}

input.txt{
  width:100%;background:#00000066;border:2px solid rgba(245,158,11,.5);border-radius:14px;
  padding:15px;text-align:center;font-size:17px;font-weight:900;text-transform:uppercase;
  letter-spacing:.06em;color:var(--txt);font-family:inherit;outline:none
}
input.txt:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(245,158,11,.12)}
.code{display:flex;gap:9px;justify-content:center;margin:6px 0 4px}
.code input{
  width:54px;height:64px;background:#000000aa;border:2px solid var(--indigo);border-radius:14px;
  text-align:center;font-size:28px;font-weight:900;text-transform:uppercase;color:#fff;
  font-family:inherit;outline:none
}
.code input:focus{background:rgba(99,102,241,.18);box-shadow:0 0 0 4px rgba(99,102,241,.16)}
.clues{display:flex;flex-direction:column;gap:8px;margin:4px 0 14px}
.clue{background:#00000050;border-left:4px solid var(--indigo);border-radius:0 11px 11px 0;padding:10px 12px;font-size:12px;line-height:1.45;color:#d6d3d1}
.clue b{color:var(--indigo)}

.scene{
  position:relative;height:160px;border-radius:16px;overflow:hidden;border:3px solid #292524;
  background:linear-gradient(#0f172a,#1e293b);margin-bottom:6px;display:flex;flex-direction:column;justify-content:flex-end
}
.scene .water{height:52%;background:linear-gradient(rgba(37,99,235,.6),rgba(29,78,216,.6));display:grid;place-items:center;font-size:10px;font-weight:900;letter-spacing:.3em;color:#bfdbfe;position:relative}
.scene .mud{position:absolute;inset:auto 0 0 0;height:45%;background:rgba(120,53,15,.8)}
.scene .banks{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;padding:10px}
.scene .banks span{font-size:34px;filter:drop-shadow(0 4px 6px #000)}
.slots{display:flex;gap:8px;margin-bottom:6px}
.slot{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.slot .yr{font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#78716c}
.slot .box{
  width:100%;height:76px;border:2px dashed #44403c;border-radius:13px;display:grid;place-items:center;
  font-size:32px;background:#00000040
}
.slot .box.full{border-style:solid;border-color:var(--green);background:rgba(34,197,94,.08)}
.slot .pick{display:flex;gap:5px;width:100%}
.slot .pick button{flex:1;border:1px solid var(--line);background:#00000050;border-radius:9px;padding:6px 0;font-size:17px;cursor:pointer}
.slot .pick button:hover{background:rgba(245,158,11,.2)}

#toast{
  position:fixed;left:50%;top:16px;transform:translate(-50%,-160%);z-index:120;
  max-width:min(440px,92vw);padding:13px 20px;border-radius:18px;text-align:center;
  box-shadow:0 20px 50px -18px #000;transition:transform .35s cubic-bezier(.2,1.2,.3,1)
}
#toast.show{transform:translate(-50%,0)}
#toast.ok{background:linear-gradient(180deg,#22c55e,#15803d)}
#toast.no{background:linear-gradient(180deg,#ef4444,#b91c1c)}
#toast b{display:block;font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
#toast span{display:block;font-size:12.5px;line-height:1.4;margin-top:3px;color:rgba(255,255,255,.92)}

.center{text-align:center}
.hero{font-size:74px;line-height:1;margin-bottom:14px;filter:drop-shadow(0 12px 20px #000)}
.big-title{font-size:38px;font-weight:900;letter-spacing:-2px;text-transform:uppercase;line-height:1}
.big-title em{color:var(--accent);font-style:normal;display:block}
.lead{font-size:13.5px;line-height:1.7;color:var(--dim);max-width:420px;margin:16px auto 22px}
.pills{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:22px}
.pill{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:#00000050;border:1px solid var(--line);padding:6px 11px;border-radius:99px}
.stars{font-size:30px;letter-spacing:5px;margin:6px 0 10px}
.fact{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.3);border-radius:14px;padding:13px 15px;font-size:12.5px;line-height:1.6;color:#d1fae5;text-align:left;margin:14px 0}
.fact b{color:var(--green);display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:4px}
.node{
  aspect-ratio:1;border-radius:13px;border:1px solid var(--line);background:#00000050;cursor:pointer;
  color:var(--txt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:900
}
.node b{font-size:15px}
.node u{font-size:8px;text-decoration:none;color:var(--amber2);letter-spacing:1px}
.node.done{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1)}
.node.now{border-color:var(--accent);background:rgba(245,158,11,.18);box-shadow:0 0 0 3px rgba(245,158,11,.14)}
.node.lock{opacity:.3;cursor:not-allowed}
.sec{font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:#78716c;margin:16px 0 8px}
footer{text-align:center;font-size:10px;color:#57534e;margin-top:22px;letter-spacing:.08em}
@media (max-width:420px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .big-title{font-size:31px}
  .code input{width:46px;height:56px;font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="toast"><b></b><span></span></div>
<div class="wrap">
  <header>
    <div class="brand" id="brand">&#9968;</div>
    <div>
      <h1>Mistérios do Solo</h1>
      <div class="sub" id="sub">Expedição Geológica</div>
    </div>
    <div class="tools">
      <button class="icobtn" id="mute" title="Ligar/desligar som">&#128266;</button>
      <button class="icobtn" id="mapbtn" title="Mapa das fases">&#128506;</button>
    </div>
  </header>
  <div class="hud" id="hud"></div>
  <div class="bar"><i id="barfill" style="width:0%"></i></div>
  <main id="app"></main>
  <footer>20 fases &middot; Ciências &middot; 6º ano</footer>
</div>
<script>
"use strict";

/* ===================== utilitários ===================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim().replace(/[-\s]+/g, " ");
const KEYS = "ABCDEFGH";

/* ===================== som (WebAudio, sem arquivos) ===================== */
let actx = null;
const beep = (freq, dur = 0.09, type = "square", gain = 0.05) => {
  if (S.mute) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch (e) { /* som é opcional */ }
};
const sfx = {
  tap:  () => beep(520, .05, "triangle", .04),
  dig:  () => beep(120 + Math.random() * 60, .12, "sawtooth", .05),
  ok:   () => { beep(660, .1, "triangle", .06); setTimeout(() => beep(880, .14, "triangle", .06), 90); },
  no:   () => { beep(200, .16, "square", .05); setTimeout(() => beep(150, .2, "square", .05), 120); },
  win:  () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .2, "triangle", .06), i * 130))
};

/* ===================== confete ===================== */
const cv = $("#fx"), cx = cv.getContext("2d");
let parts = [], raf = 0;
const fit = () => { cv.width = innerWidth; cv.height = innerHeight; };
addEventListener("resize", fit); fit();
function burst(n = 70, colors = ["#f59e0b", "#fbbf24", "#22c55e", "#818cf8", "#fff"]) {
  for (let i = 0; i < n; i++) parts.push({
    x: innerWidth / 2 + (Math.random() - .5) * 160, y: innerHeight * .38,
    vx: (Math.random() - .5) * 11, vy: -Math.random() * 13 - 3,
    s: 3 + Math.random() * 6, c: colors[i % colors.length], r: Math.random() * 6, vr: (Math.random() - .5) * .4
  });
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.y < innerHeight + 40);
  parts.forEach(p => {
    p.vy += .32; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 1.6); cx.restore();
  });
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, cv.width, cv.height), 0);
}

/* ===================== conteúdo das 20 fases ===================== */
/* Cada fase = lista de etapas. Tipos: quiz, multi, order, slider, text, dig, mix, crop, nums, code */
const PHASES = [
{
  t: "Origem Primordial", ico: "&#9935;",
  brief: "Todo solo nasce da lenta destruição de uma rocha. Cave camada por camada até bater no fundo e descubra o nome do material que dá origem a tudo.",
  fact: "Formar 1 cm de solo pode levar de 100 a 400 anos. É por isso que solo perdido por erosão não volta na nossa escala de tempo.",
  steps: [
    { type: "dig", prompt: "Clique nas camadas de cima para baixo para escavar o perfil.", layers: [
      { l: "Superfície", c: "#14532d", say: "Muitas folhas, raízes e bichinhos aqui em cima!" },
      { l: "Húmus", c: "#1c1917", say: "Ficou escuro e cheiroso: matéria orgânica decomposta." },
      { l: "Minerais", c: "#78350f", say: "Agora dominam os minerais. A luz já não chega aqui." },
      { l: "Fragmentos", c: "#57534e", say: "Comecei a encontrar pedaços de rocha quebrada..." },
      { l: "Base Sólida", c: "#78716c", say: "Bati numa parede de pedra inteira. Fim da escavação!" }
    ]},

/* ===================== estado ===================== */
const SAVE = "misterios-solo-v1";
const fresh = () => ({ scr: "home", ph: 0, st: 0, score: 0, streak: 0, best: 0, stars: {}, pen: 0, mute: false, secs: 0 });
let S = fresh();
try {
  const raw = localStorage.getItem(SAVE);
  if (raw) S = Object.assign(fresh(), JSON.parse(raw));
} catch (e) {}
S.scr = S.ph > 0 ? "map" : "home";
const save = () => { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} };

let W = {};               /* estado volátil da etapa atual */
let timer = null;
const startClock = () => { clearInterval(timer); timer = setInterval(() => { S.secs++; paintHud(); }, 1000); };
const mmss = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
const totalStars = () => Object.values(S.stars).reduce((a, b) => a + b, 0);
const isLate = () => S.scr === "play" && !!PHASES[S.ph].late;

/* ===================== HUD ===================== */
function paintHud() {
  const playing = S.scr === "play" || S.scr === "done";
  $("#hud").innerHTML = playing ? `
    <div class="stat"><b>${S.score}</b><span>Pontos</span></div>
    <div class="stat"><b>${S.ph + 1}/20</b><span>Fase</span></div>
    <div class="stat"><b>&#11088; ${totalStars()}</b><span>Estrelas</span></div>
    <div class="stat"><b>${mmss(S.secs)}</b><span>Tempo</span></div>` : "";
  $("#barfill").style.width = (playing ? ((S.ph + (S.scr === "done" ? 1 : 0)) / 20) * 100 : 0) + "%";
  document.body.classList.toggle("late", isLate());
  $("#brand").classList.toggle("late", isLate());
  $("#brand").innerHTML = S.scr === "win" ? "&#127942;" : (isLate() ? "&#128300;" : "&#9968;");
  $("#sub").textContent = isLate() ? "Olimpíada de Ciências" : "Expedição Geológica";
  $("#mute").innerHTML = S.mute ? "&#128263;" : "&#128266;";
}

/* ===================== feedback ===================== */
let tmr = null;
function toast(ok, msg) {
  const t = $("#toast");
  t.className = "show " + (ok ? "ok" : "no");
  t.querySelector("b").textContent = ok ? "Muito bem!" : "Quase!";
  t.querySelector("span").textContent = msg;
  clearTimeout(tmr);
  tmr = setTimeout(() => { t.className = ""; }, ok ? 1600 : 3200);
}
function wrong(msg) {
  sfx.no(); S.pen++; S.streak = 0;
  const c = $(".card"); if (c) { c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); }
  toast(false, msg); paintHud(); save();
}
function right(msg) {
  sfx.ok(); S.streak++;
  const bonus = S.streak >= 3 ? 10 : 0;
  S.score += 20 + bonus;
  toast(true, msg + (bonus ? "  (+" + bonus + " de sequência!)" : ""));
  paintHud();
  const ph = PHASES[S.ph];
  setTimeout(() => {
    if (S.st + 1 < ph.steps.length) { S.st++; W = {}; render(); }
    else finishPhase();
  }, 950);
}
function finishPhase() {
  const stars = S.pen === 0 ? 3 : S.pen <= 2 ? 2 : 1;
  S.score += stars * 30;
  S.stars[S.ph] = Math.max(S.stars[S.ph] || 0, stars);
  S.scr = "done"; save(); sfx.win(); burst(stars * 28); render();
}
function nextPhase() {
  if (S.ph + 1 >= PHASES.length) { S.scr = "win"; S.best = Math.max(S.best, S.score); clearInterval(timer); save(); burst(140); render(); return; }
  S.ph++; S.st = 0; S.pen = 0; W = {}; S.scr = "play"; save(); render();
}
function askHint() {
  const st = PHASES[S.ph].steps[S.st];
  const h = st.hint || st.opts && "Elimine as alternativas que mudam de assunto." || "Releia o enunciado com atenção.";
  S.score = Math.max(0, S.score - 10); S.pen++; sfx.tap(); paintHud(); save();
  toast(false, "Dica (-10 pts): " + h);
}

const R = {
  quiz(st) {
    const cols = st.cols === 2;
    const scene = st.scene === "river" ? `
      <div class="scene">
        <div class="banks"><span>&#127794;</span><span>&#127794;</span></div>
        <div class="water">LEITO DO RIO<div class="mud"></div></div>
      </div>` : "";
    return scene + `<p class="prompt">${st.prompt}</p>
      <div class="${cols ? "grid" : "opts"}" style="${cols ? "grid-template-columns:repeat(2,1fr)" : ""}">
        ${st.opts.map((o, i) => cols
          ? `<button class="tile" data-a="opt" data-i="${i}"><span class="e">${o.e || "&#10022;"}</span><span class="l">${o.l}</span></button>`
          : `<button class="opt" data-a="opt" data-i="${i}"><span class="k">${KEYS[i]}</span><span>${o.l}${o.d ? `<em>${o.d}</em>` : ""}</span></button>`
        ).join("")}
      </div>`;
  },
  multi(st) {
    W.pick = W.pick || [];
    const body = st.list
      ? `<div class="opts">${st.tiles.map((t, i) =>
          `<button class="opt ${W.pick.includes(i) ? "on" : ""}" data-a="togg" data-i="${i}"><span class="k">${W.pick.includes(i) ? "&#10003;" : KEYS[i]}</span><span>${t.l}</span></button>`).join("")}</div>`
      : `<div class="grid">${st.tiles.map((t, i) =>
          `<button class="tile ${W.pick.includes(i) ? "on" : ""}" data-a="togg" data-i="${i}"><span class="e">${t.e}</span><span class="l">${t.l}</span></button>`).join("")}</div>`;
    return `<p class="prompt">${st.prompt}</p>${body}
      <div class="hintline">selecionados: ${W.pick.length} de ${st.need}</div>
      <div class="row"><button class="btn" data-a="check" ${W.pick.length === st.need ? "" : "disabled"}>Verificar</button></div>`;
  },
  order(st) {
    W.ord = W.ord || st.items.slice();
    return `<p class="prompt">${st.prompt}</p>
      <div class="sortlist">${W.ord.map((it, i) => `
        <div class="sortitem">
          <span class="dot" style="background:${it.c}"></span>
          <span class="nm">${it.n}</span>
          <span class="ar">
            <button data-a="mv" data-i="${i}" data-d="-1" ${i === 0 ? "disabled" : ""}>&#9650;</button>
            <button data-a="mv" data-i="${i}" data-d="1" ${i === W.ord.length - 1 ? "disabled" : ""}>&#9660;</button>
          </span>
        </div>`).join("")}</div>
      <div class="hintline">topo = superfície &middot; base = rocha</div>
      <div class="row"><button class="btn" data-a="check">Verificar estrutura</button></div>`;
  },
  slider(st) {
    W.v = W.v === undefined ? st.start : W.v;
    const v = W.v, good = v >= st.lo && v <= st.hi;
    return `<p class="prompt">${st.prompt}</p>
      <div class="gauge">
        <div class="lbl">${st.lbl}</div>
        <div class="big" style="color:${good ? "var(--green)" : "var(--txt)"}">${v.toFixed(1)}</div>
        <div class="st" style="color:${good ? "var(--green)" : "var(--dim)"}">${st.read(v)}</div>
      </div>
      <input type="range" min="${st.min}" max="${st.max}" step="${st.step}" value="${v}" data-a="rng">
      <button class="btn" data-a="check">Analisar amostra</button>`;
  },
  mix(st) {
    W.v = W.v === undefined ? st.start : W.v;
    const a = W.v, c = 100 - a;
    return `<p class="prompt">${st.prompt}</p>
      <div class="mix">
        <div class="mixcol"><i style="height:${a}%;background:#f59e0b"></i><span>${a}%<br>Areia</span></div>
        <div class="mixcol"><i style="height:${c}%;background:#c2410c"></i><span>${c}%<br>Argila</span></div>
      </div>
      <input type="range" min="10" max="90" step="5" value="${a}" data-a="rng">
      <button class="btn lateb" data-a="check">Testar permeabilidade</button>`;
  },
  crop(st) {
    W.seq = W.seq || [null, null, null];
    const E = { milho: "&#127805;", soja: "&#127793;" };
    return `<p class="prompt">${st.prompt}</p>
      <div class="slots">${W.seq.map((v, i) => `
        <div class="slot">
          <span class="yr">Ano ${i + 1}</span>
          <div class="box ${v ? "full" : ""}">${v ? E[v] : "&middot;"}</div>
          <span class="pick">
            <button data-a="slot" data-i="${i}" data-c="milho" title="Milho">&#127805;</button>
            <button data-a="slot" data-i="${i}" data-c="soja" title="Soja (leguminosa)">&#127793;</button>
          </span>
        </div>`).join("")}</div>
      <div class="hintline">&#127805; milho &middot; &#127793; soja (devolve nitrogênio)</div>
      <div class="row"><button class="btn lateb" data-a="check">Verificar ciclo</button></div>`;
  },
  nums(st) {
    W.n = W.n || st.items.reduce((o, i) => (o[i.id] = 25, o), {});
    const sum = st.items.reduce((a, i) => a + W.n[i.id], 0);
    return `<p class="prompt">${st.prompt}</p>
      <div class="nums">${st.items.map(i => `
        <div class="num">
          <div class="l">${i.l}</div>
          <div class="c">
            <button data-a="inc" data-i="${i.id}" data-d="-5">&minus;</button>
            <b>${W.n[i.id]}%</b>
            <button data-a="inc" data-i="${i.id}" data-d="5">+</button>
          </div>
        </div>`).join("")}</div>
      <div class="total" style="color:${sum === 100 ? "var(--green)" : "var(--red)"}">Total: ${sum}%</div>
      <button class="btn lateb" data-a="check">Validar proporções</button>`;
  },
  text(st) {
    return `<p class="prompt">${st.prompt}</p>
      <input class="txt" id="ti" placeholder="${st.ph}" autocomplete="off" spellcheck="false">
      <div class="row"><button class="btn ${isLate() ? "lateb" : ""}" data-a="check">Confirmar resposta</button></div>`;
  },
  dig(st) {
    W.dug = W.dug || [];
    const done = W.dug.length === st.layers.length;
    return `<div class="speech"><span class="who">&#129485;</span><span>${W.say || st.prompt}</span></div>
      <div class="dig">${st.layers.map((l, i) => `
        <button data-a="dig" data-i="${i}" class="${W.dug.includes(i) ? "gone" : ""}" style="background:${l.c}">${l.l}</button>`).join("")}</div>
      ${done ? `<div class="row"><button class="btn" data-a="check">Continuar</button></div>` : ""}`;
  },
  code(st) {
    return `<p class="prompt">${st.prompt}</p>
      <div class="clues">
        <div class="clue"><b>1.</b> Silte &nbsp;<b>2.</b> Horizonte O &nbsp;<b>3.</b> Lençol freático &nbsp;<b>4.</b> Óxido de ferro</div>
      </div>
      <div class="code">${[0, 1, 2, 3].map(i => `<input maxlength="1" data-a="cd" data-i="${i}" autocomplete="off">`).join("")}</div>
      <div class="row"><button class="btn gr" data-a="check">Abrir o cofre</button></div>`;
  }
};

/* ===================== verificações ===================== */
const C = {
  multi(st) {
    const ok = st.tiles.map((t, i) => t.ok ? i : -1).filter(i => i >= 0);
    return W.pick.length === st.need && W.pick.every(i => ok.includes(i))
      ? [1, "Composição correta!"]
      : [0, "Alguma escolha não faz parte do solo natural. Revise."];
  },
  order(st) {
    return W.ord.map(i => i.id).join("") === st.correct.join("")
      ? [1, "Perfil na ordem certa: O, A, B, C."]
      : [0, "A ordem vai do que você pisa até a rocha inteira."];
  },
  slider(st) {
    return W.v >= st.lo && W.v <= st.hi ? [1, "Faixa ideal encontrada!"] : [0, W.v < st.lo ? st.lowMsg : st.highMsg];
  },
  mix(st) {
    return W.v >= st.lo && W.v <= st.hi ? [1, "Solo franco: equilíbrio perfeito!"] : [0, W.v > st.hi ? st.highMsg : st.lowMsg];
  },
  crop() {
    if (W.seq.includes(null)) return [0, "Preencha os 3 anos de plantio."];
    const [a, b, c] = W.seq;
    return (a !== b && b !== c) ? [1, "Rotação correta: a leguminosa repõe o nitrogênio."]
      : [0, "Repetir a mesma cultura em anos seguidos é monocultura — alterne!"];
  },
  nums(st) {
    const sum = st.items.reduce((a, i) => a + W.n[i.id], 0);
    if (sum !== 100) return [0, "A soma precisa dar exatamente 100%. Está em " + sum + "%."];
    return st.items.every(i => W.n[i.id] === i.target)
      ? [1, "Gráfico do solo ideal montado!"]
      : [0, "Quase: o sólido pesa mais que os poros, e ar e água ficam iguais."];
  },
  text(st) {
    const v = norm($("#ti") ? $("#ti").value : "");
    if (!v) return [0, "Escreva sua resposta antes de confirmar."];
    return st.accept.some(a => norm(a) === v) ? [1, "Resposta exata!"] : [0, "Não é isso. Use a dica se precisar."];
  },
  dig(st) {
    return W.dug.length === st.layers.length ? [1, "Perfil escavado até a base!"] : [0, "Continue escavando."];
  },
  code(st) {
    const v = (W.cd || []).join("").toUpperCase();
    return v === st.answer ? [1, "Cofre aberto! O solo é a base da vida."] : [0, "Senha incorreta. Junte as iniciais das 4 respostas."];
  }
};

/* ===================== telas ===================== */
function render() {
  const app = $("#app");
  paintHud();
  if (S.scr === "home") {
    app.innerHTML = `<div class="card anim center">
      <div class="hero">&#128506;</div>
      <div class="big-title">Jornada<em>Geológica</em></div>
      <p class="lead">Vinte desafios sobre o solo: escave um perfil, meça o pH, monte a mistura ideal, salve um rio e abra o cofre final da Olimpíada de Ciências.</p>
      <div class="pills"><span class="pill">20 fases</span><span class="pill">10 minijogos</span><span class="pill">&#11088; 60 estrelas</span><span class="pill">Salva sozinho</span></div>
      <button class="btn" data-a="start" style="padding:19px">Iniciar expedição</button>
      ${S.best ? `<div class="hintline">melhor pontuação: ${S.best}</div>` : ""}
    </div>`;
    return;
  }
  if (S.scr === "map") {
    const unlocked = Math.max(...Object.keys(S.stars).map(Number).concat([-1])) + 1;
    const node = i => {
      const s = S.stars[i], cls = s ? "done" : i === S.ph ? "now" : i <= unlocked ? "" : "lock";
      return `<button class="node ${cls}" data-a="sel" data-i="${i}" ${i > unlocked ? "disabled" : ""}>
        <b>${i + 1}</b><u>${s ? "&#11088;".repeat(s) : i <= unlocked ? "&#9679;" : "&#128274;"}</u></button>`;
    };
    app.innerHTML = `<div class="card anim">
      <div class="phead"><span class="tag">Mapa da expedição</span>
        <button class="ghost" data-a="reset">apagar progresso</button></div>
      <div class="sec">Fundamentos &middot; fases 1 a 10</div>
      <div class="map">${[...Array(10)].map((_, i) => node(i)).join("")}</div>
      <div class="sec">Olimpíada de Ciências &middot; fases 11 a 20</div>
      <div class="map">${[...Array(10)].map((_, i) => node(i + 10)).join("")}</div>
      <div class="row"><button class="btn" data-a="sel" data-i="${Math.min(unlocked, 19)}">
        ${unlocked === 0 ? "Começar fase 1" : "Continuar na fase " + (Math.min(unlocked, 19) + 1)}</button></div>
      <div class="hintline">pontos ${S.score} &middot; estrelas ${totalStars()}/60 &middot; tempo ${mmss(S.secs)}</div>
    </div>`;
    return;
  }
  if (S.scr === "play") {
    const ph = PHASES[S.ph], st = ph.steps[S.st];
    app.innerHTML = `<div class="card anim ${ph.late ? "late" : ""}">
      <div class="phead">
        <span class="tag">Fase ${S.ph + 1} de 20</span>
        ${S.streak >= 2 ? `<span class="tag">&#128293; ${S.streak} seguidas</span>` : ""}
        <button class="ghost" data-a="map">mapa</button>
      </div>
      <h2 class="ptitle">${ph.ico} ${ph.t}</h2>
      <div class="brief">${ph.brief}</div>
      ${ph.steps.length > 1 ? `<div class="steps">${ph.steps.map((_, i) => `<i class="${i <= S.st ? "on" : ""}"></i>`).join("")}</div>` : ""}
      ${R[st.type](st)}
      <div class="row"><button class="btn gh" data-a="hint">&#128161; Dica (-10 pts)</button></div>
    </div>`;
    const ti = $("#ti"); if (ti) ti.focus();
    const c0 = $(".code input"); if (c0) c0.focus();
    return;
  }
  if (S.scr === "done") {
    const ph = PHASES[S.ph], s = S.stars[S.ph];
    app.innerHTML = `<div class="card anim center ${ph.late ? "late" : ""}">
      <div class="hero">${ph.ico}</div>
      <div class="big-title" style="font-size:27px">Fase ${S.ph + 1} concluída</div>
      <div class="stars">${"&#11088;".repeat(s)}${"&#128308;".repeat(0)}${"&#9734;".repeat(3 - s)}</div>
      <div class="fact"><b>Você sabia?</b>${ph.fact}</div>
      <button class="btn ${ph.late ? "lateb" : ""}" data-a="next">
        ${S.ph + 1 >= PHASES.length ? "Ver diploma" : "Próxima fase &#8594;"}</button>
      <div class="row"><button class="btn gh" data-a="map">Voltar ao mapa</button></div>
    </div>`;
    return;
  }
  if (S.scr === "win") {
    const st = totalStars(), pct = Math.round(st / 60 * 100);
    const nota = pct >= 90 ? "Geólogo-chefe" : pct >= 70 ? "Pesquisador de campo" : pct >= 50 ? "Aprendiz de expedição" : "Explorador iniciante";
    app.innerHTML = `<div class="card anim center late">
      <div class="hero">&#127942;</div>
      <div class="big-title">Diplomado!</div>
      <p class="lead">Você atravessou as 20 fases, da rocha-mãe ao cofre final. Agora sabe como o solo nasce, como ele se perde e como cuidamos dele.</p>
      <div class="hud" style="margin:0 0 14px">
        <div class="stat"><b>${S.score}</b><span>Pontos</span></div>
        <div class="stat"><b>${st}/60</b><span>Estrelas</span></div>
        <div class="stat"><b>${mmss(S.secs)}</b><span>Tempo</span></div>
      </div>
      <div class="pills"><span class="pill">Título: ${nota}</span><span class="pill">${pct}% de aproveitamento</span></div>
      <button class="btn gr" data-a="again">Jogar de novo</button>
      <div class="row"><button class="btn gh" data-a="map">Rever fases</button></div>
    </div>`;
    return;
  }
}

/* ===================== interação (delegação de eventos) ===================== */
$("#app").addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
  const a = b.dataset.a, i = +b.dataset.i;
  const ph = PHASES[S.ph], st = ph && ph.steps[S.st];

  switch (a) {
    case "start": S.ph = 0; S.st = 0; S.pen = 0; S.scr = "play"; W = {}; startClock(); save(); render(); break;
    case "map": S.scr = "map"; render(); break;
    case "sel": S.ph = i; S.st = 0; S.pen = 0; W = {}; S.scr = "play"; startClock(); save(); render(); break;
    case "next": nextPhase(); break;
    case "again": S = fresh(); S.scr = "play"; W = {}; startClock(); save(); render(); break;
    case "reset":
      if (confirm("Apagar todo o progresso salvo?")) { S = fresh(); localStorage.removeItem(SAVE); render(); }
      break;
    case "hint": askHint(); break;

    case "opt": {
      const o = st.opts[i];
      $$(".opt,.tile", $("#app")).forEach((el, k) => el.classList.add(st.opts[k] && st.opts[k].ok ? "ok" : "no"));
      o.ok ? right(o.why || "Correto!") : wrong(o.why || "Não é essa.");
      if (!o.ok) setTimeout(() => render(), 900);
      break;
    }
    case "togg":
      sfx.tap();
      W.pick = W.pick.includes(i) ? W.pick.filter(x => x !== i) : W.pick.concat(i).slice(-st.need);
      render(); break;
    case "mv": {
      sfx.tap();
      const d = +b.dataset.d, j = i + d;
      if (j < 0 || j >= W.ord.length) break;
      const arr = W.ord.slice(); [arr[i], arr[j]] = [arr[j], arr[i]]; W.ord = arr; render(); break;
    }
    case "dig": {
      if (W.dug.includes(i)) break;
      if (i !== W.dug.length) { W.say = "Devemos cavar camada por camada, de cima para baixo!"; sfx.no(); render(); break; }
      sfx.dig(); W.dug = W.dug.concat(i); W.say = st.layers[i].say; render(); break;
    }
    case "slot": sfx.tap(); W.seq[i] = b.dataset.c; render(); break;
    case "inc": {
      sfx.tap();
      const d = +b.dataset.d, id = b.dataset.i;
      W.n[id] = Math.min(100, Math.max(0, W.n[id] + d)); render(); break;
    }
    case "check": {
      const [ok, msg] = C[st.type](st);
      ok ? right(msg) : wrong(msg);
      break;
    }
  }
});

$("#app").addEventListener("input", e => {
  const a = e.target.dataset.a;
  const st = PHASES[S.ph] && PHASES[S.ph].steps[S.st];
  if (a === "rng") { W.v = parseFloat(e.target.value); render(); }
  if (a === "cd") {
    W.cd = W.cd || ["", "", "", ""];
    W.cd[+e.target.dataset.i] = e.target.value.toUpperCase();
    e.target.value = W.cd[+e.target.dataset.i];
    const nx = $$(".code input")[+e.target.dataset.i + 1];
    if (e.target.value && nx) nx.focus();
  }
});

document.addEventListener("keydown", e => {
  if (S.scr !== "play") {
    if (e.key === "Enter") { const b = $("#app .btn:not([disabled])"); if (b) b.click(); }
    return;
  }
  const st = PHASES[S.ph].steps[S.st];
  if (e.key === "Enter") {
    e.preventDefault();
    const b = $('#app [data-a="check"]:not([disabled])'); if (b) b.click();
    return;
  }
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  if (st.type === "quiz" && /^[1-9]$/.test(e.key)) {
    const b = $$('#app [data-a="opt"]')[+e.key - 1]; if (b) b.click();
  }
  if (st.type === "slider" || st.type === "mix") {
    const r = $('#app [data-a="rng"]'); if (!r) return;
    if (e.key === "ArrowLeft") { r.value = +r.value - +r.step; r.dispatchEvent(new Event("input", { bubbles: true })); }
    if (e.key === "ArrowRight") { r.value = +r.value + +r.step; r.dispatchEvent(new Event("input", { bubbles: true })); }
  }
});

$("#mute").addEventListener("click", () => { S.mute = !S.mute; save(); paintHud(); if (!S.mute) sfx.tap(); });
$("#mapbtn").addEventListener("click", () => { S.scr = "map"; render(); });

render();
if (S.scr !== "home") startClock();
</script>
</body>
</html>
